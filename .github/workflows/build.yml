name: 编译并发布存档浏览器

# 推版本标签时自动构建并发布；手动运行用于从分支构建最新版本。
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

# 标签构建按标签串行；手动构建共用一个组，避免同时改写 latest。
concurrency:
  group: world-viewer-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 编译 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            executable: world-viewer
          - target: windows-amd64
            goos: windows
            goarch: amd64
            executable: world-viewer.exe
          - target: linux-amd64
            goos: linux
            goarch: amd64
            executable: world-viewer
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'

    steps:
      - name: 读取选定版本的应用源码
        uses: actions/checkout@v7
        with:
          path: apps/neomega-viewer

      - name: 按工作区布局读取依赖仓库
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          # go.mod 的本地 replace 要求基础库与 apps 保持这一层级。
          for module in neomega-nbt neomega-blocks neomega-celler neomega-packfs neomega-converter-core neomega-viewer-core; do
            git clone --depth 1 "https://github.com/$REPOSITORY_OWNER/$module.git" "$module"
          done
          git clone --depth 1 "https://github.com/$REPOSITORY_OWNER/neomega-converter.git" apps/neomega-converter

      - name: 准备 Go 和依赖缓存
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/neomega-viewer/go.mod
          cache-dependency-path: '**/go.sum'

      - name: 确定版本号
        id: version
        working-directory: apps/neomega-viewer
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # 版本标签是唯一来源，格式在这里把关。
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "版本标签必须形如 v0.0.10，实际为 $REF_NAME" >&2
              exit 1
            fi
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            # 手动构建不发布正式版本，用提交短号区分，避免冒充已发布标签。
            echo "value=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译包含网页与资源的可执行文件
        working-directory: apps/neomega-viewer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXECUTABLE: ${{ matrix.executable }}
          VERSION: ${{ steps.version.outputs.value }}
        run: go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$EXECUTABLE" ./cmd/world-viewer

      - name: 核对注入的版本号
        # 只有 Linux 产物能在 runner 上执行，用它确认 -ldflags 没有写错变量名。
        if: matrix.target == 'linux-amd64'
        working-directory: apps/neomega-viewer
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: test "$(./dist/world-viewer -version)" = "$VERSION"

      - name: 打包对应平台的版本
        working-directory: apps/neomega-viewer
        env:
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.goos }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          mkdir -p dist/packages
          if [ "$TARGET_OS" = windows ]; then
            zip -j "dist/packages/world-viewer-$TARGET.zip" "dist/$EXECUTABLE"
          else
            # tar 保留 macOS 与 Linux 可执行文件的运行权限。
            tar -czf "dist/packages/world-viewer-$TARGET.tar.gz" -C dist "$EXECUTABLE"
          fi

      - name: 上传可下载的编译版本
        uses: actions/upload-artifact@v7
        with:
          path: apps/neomega-viewer/dist/packages/*
          archive: false
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 读取本次构建对应的提交
        uses: actions/checkout@v7

      - name: 收齐三个平台的压缩包
        uses: actions/download-artifact@v8
        with:
          pattern: world-viewer-*
          path: dist
          merge-multiple: true
          # Windows 版本本身就是 zip，保留压缩包供 Release 下载。
          skip-decompress: true

      - name: 发布版本或更新 latest
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          存档浏览器，提供 macOS arm64、Windows amd64 和 Linux amd64 版本。

          解压后启动 world-viewer（Windows 为 world-viewer.exe），再在浏览器打开 http://127.0.0.1:2412。

          Release 中的下载包解压后即可运行；版本 Release 与同名 Git 标签对应，latest 是浮动的最新构建入口。
          EOF

          if [ "$REF_TYPE" = "tag" ]; then
            # 标签构建发布同名 Release。重跑同一标签时只替换下载包。
            if gh release view "$REF_NAME" > /dev/null 2>&1; then
              gh release upload "$REF_NAME" dist/* --clobber
              gh release edit "$REF_NAME" --title "$REF_NAME" --notes-file release-notes.md --latest
            else
              gh release create "$REF_NAME" dist/* --verify-tag --title "$REF_NAME" --notes-file release-notes.md --latest
            fi
          else
            # 手动构建更新固定下载入口 latest，标签随成功构建移动到实际编译的提交。
            git tag --force latest "$GITHUB_SHA"
            git push --force origin refs/tags/latest

            if gh release view latest > /dev/null 2>&1; then
              gh release upload latest dist/* --clobber
              gh release edit latest --title latest --notes-file release-notes.md --latest
            else
              gh release create latest dist/* --verify-tag --title latest --notes-file release-notes.md --latest
            fi
          fi
