name: 手动编译存档浏览器

on:
  workflow_dispatch:

# latest 由每次成功构建替换，同一时间只运行一批，避免发布互相覆盖。
concurrency:
  group: world-viewer-latest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 编译 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            executable: world-viewer
          - target: windows-amd64
            goos: windows
            goarch: amd64
            executable: world-viewer.exe
          - target: linux-amd64
            goos: linux
            goarch: amd64
            executable: world-viewer
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'

    steps:
      - name: 读取选定版本的应用源码
        uses: actions/checkout@v7
        with:
          path: apps/neomega-viewer

      - name: 按工作区布局读取依赖仓库
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          # go.mod 的本地 replace 要求基础库与 apps 保持这一层级。
          for module in neomega-nbt neomega-blocks neomega-celler neomega-packfs neomega-converter-core neomega-viewer-core; do
            git clone --depth 1 "https://github.com/$REPOSITORY_OWNER/$module.git" "$module"
          done
          git clone --depth 1 "https://github.com/$REPOSITORY_OWNER/neomega-converter.git" apps/neomega-converter

      - name: 准备 Go 和依赖缓存
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/neomega-viewer/go.mod
          cache-dependency-path: '**/go.sum'

      - name: 编译包含网页与资源的可执行文件
        working-directory: apps/neomega-viewer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXECUTABLE: ${{ matrix.executable }}
        run: go build -trimpath -ldflags='-s -w' -o "dist/$EXECUTABLE" ./cmd/world-viewer

      - name: 打包对应平台的版本
        working-directory: apps/neomega-viewer
        env:
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.goos }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          mkdir -p dist/packages
          if [ "$TARGET_OS" = windows ]; then
            zip -j "dist/packages/world-viewer-$TARGET.zip" "dist/$EXECUTABLE"
          else
            # tar 保留 macOS 与 Linux 可执行文件的运行权限。
            tar -czf "dist/packages/world-viewer-$TARGET.tar.gz" -C dist "$EXECUTABLE"
          fi

      - name: 上传可下载的编译版本
        uses: actions/upload-artifact@v7
        with:
          path: apps/neomega-viewer/dist/packages/*
          archive: false
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 更新 latest Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 读取本次构建对应的提交
        uses: actions/checkout@v7

      - name: 收齐三个平台的压缩包
        uses: actions/download-artifact@v8
        with:
          pattern: world-viewer-*
          path: dist
          merge-multiple: true
          # Windows 版本本身就是 zip，保留压缩包供 Release 下载。
          skip-decompress: true

      - name: 发布或替换 latest 的下载包
        shell: bash
        run: |
          # latest 是固定下载入口，标签随成功构建移动到实际编译的提交。
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

          cat > release-notes.md <<'EOF'
          最新成功构建的存档浏览器，提供 macOS arm64、Windows amd64 和 Linux amd64 版本。

          解压后启动 world-viewer（Windows 为 world-viewer.exe），再在浏览器打开 http://127.0.0.1:2412。

          每次手动构建成功后会替换这三个下载包。
          EOF

          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh release edit latest --title latest --notes-file release-notes.md --latest
          else
            gh release create latest dist/* --verify-tag --title latest --notes-file release-notes.md --latest
          fi
